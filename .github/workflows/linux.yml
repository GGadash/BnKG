name: Linux portable build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 libxcb-image0 libxcb-randr0 libxcb-xfixes0 libpulse0 xvfb
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Offline regression
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python -u -m pytest -v -s -k "not one_hour" -o faulthandler_timeout=20
      - name: Build portable
        run: python scripts/build_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: release-assets/*linux*
  verify:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: release-assets
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 libxcb-image0 libxcb-randr0 libxcb-xfixes0 libpulse0 xvfb
      - name: Check extracted package
        run: xvfb-run -a python scripts/verify_linux.py release-assets/*Portable.tar.gz
