[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bnkg"
version = "0.4.0a1"
description = "Independent SLM remote desktop studio for HBK 2255 and B&K 2245"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "Gadash (Akila DJ)"}]
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "requests>=2.32,<3",
    "pyqtgraph>=0.13.7,<0.15",
    "openpyxl>=3.1,<4",
    "zeroconf>=0.148,<1",
    "websockets>=17.0.1,<18",
    "pyside6-addons==6.11.2",
    "pillow>=12.1.1,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[project.gui-scripts]
bnkg = "bnkg.app:main"

[project.scripts]
bnkg-probe = "bnkg.probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = ["hardware: requires an explicitly available instrument", "writes_device: requires explicit authorization to change a real instrument"]
addopts = "-m 'not hardware and not writes_device'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
